# The manifest carries a sha256 per file, and `postman init` rejects a file whose
# bytes do not match. A stale manifest therefore does not fail loudly here - it
# fails on a user's machine, as a skill that silently falls back to the CLI's
# bundled copy. Checking it on every push is much cheaper than diagnosing that.
name: Validate

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manifest is in sync with the skill files
        run: node scripts/build-manifest.js --check

      # Each marketplace sets its own version deliberately, so nothing here
      # compares them to each other. What still has to hold is internal: a
      # marketplace's manifest version and the two version strings in its own MCP
      # headers describe one release, and nothing at runtime rejects them if they
      # disagree - the server accepts the request and the traffic is filed under a
      # version that was never cut. The live DevRel plugin drifted this way once.
      - name: Each marketplace agrees with its own MCP headers
        run: |
          node -e '
            const fs = require("fs");
            const routes = [
              ["claude-code", ".claude-plugin/plugin.json", "mcp.claude-code.json"],
              ["cursor",      ".cursor-plugin/plugin.json", "mcp.cursor.json"],
              ["kimi",        ".kimi-plugin/plugin.json",   ".kimi-plugin/plugin.json"]
            ];
            const sources = new Set();
            let bad = 0;
            for (const [agent, manifest, config] of routes) {
              const version = JSON.parse(fs.readFileSync(manifest, "utf8")).version,
                  headers = JSON.parse(fs.readFileSync(config, "utf8")).mcpServers.postman.headers,
                  want = `postman-${agent}-plugin`;
              for (const [key, expected] of [
                ["X-Source", want],
                ["X-Plugin-Version", version],
                ["User-Agent", `${want}/${version}`]
              ]) {
                if (headers[key] !== expected) {
                  console.log(`::error file=${config}::${key} is "${headers[key]}", expected "${expected}"`);
                  bad++;
                }
              }
              if (sources.has(headers["X-Source"])) {
                console.log(`::error file=${config}::X-Source "${headers["X-Source"]}" is not unique; two clients would share one telemetry bucket`);
                bad++;
              }
              sources.add(headers["X-Source"]);
              console.log(`${bad ? "    " : "ok  "}${agent.padEnd(12)}${version}`);
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Manifests are valid JSON
        run: |
          for file in .claude-plugin/marketplace.json .claude-plugin/plugin.json .cursor-plugin/plugin.json .kimi-plugin/plugin.json mcp.claude-code.json mcp.cursor.json manifest.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" && echo "ok $file"
          done

      - name: Every skill has frontmatter Claude Code can load
        run: |
          status=0
          for skill in skills/*/SKILL.md; do
            head -1 "$skill" | grep -qx -- '---' || { echo "::error file=$skill::missing YAML frontmatter"; status=1; }
            grep -qE '^name:' "$skill" || { echo "::error file=$skill::frontmatter has no name"; status=1; }
            grep -qE '^description:' "$skill" || { echo "::error file=$skill::frontmatter has no description"; status=1; }
          done
          exit $status
